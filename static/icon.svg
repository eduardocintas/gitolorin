<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hatGrey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="55%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="cloakGrey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="staffGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark slate rounded badge -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Grey cloak & shoulders -->
  <path d="M22 114 C24 88, 38 78, 54 78 C70 78, 84 88, 86 114 Z" fill="url(#cloakGrey)"/>

  <!-- Flowing silver-white beard -->
  <path d="M39 66 Q54 72 69 66 L64 96 Q54 108 44 96 Z" fill="#e2e8f0"/>
  <path d="M44 70 L54 98 L62 72 Z" fill="#f8fafc"/>

  <!-- Pointed Grey Wizard Hat & Brim (Olórin the Grey) -->
  <path d="M54 18 L32 62 L76 62 Z" fill="url(#hatGrey)"/>
  <ellipse cx="54" cy="63" rx="34" ry="8" fill="#475569"/>
  <ellipse cx="54" cy="61.5" rx="33" ry="6.5" fill="#94a3b8"/>
  <!-- Hat band -->
  <path d="M36 55 Q54 59 72 55 L74 59 Q54 63 34 59 Z" fill="#334155"/>

  <!-- Raised Wooden Staff on the right ("You shall not pass!") -->
  <line x1="98" y1="30" x2="94" y2="114" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
  <line x1="98" y1="30" x2="94" y2="114" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <!-- Staff crown prongs -->
  <path d="M90 34 Q98 24 106 34" fill="none" stroke="#92400e" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Glowing light orb atop the raised staff -->
  <circle cx="98" cy="24" r="18" fill="url(#staffGlow)"/>
  <circle cx="98" cy="24" r="6" fill="#ffffff"/>
</svg>
